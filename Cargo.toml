[workspace]
members = [
    "packages/korabo-group-handler",
    "packages/korabo-group-members-handler",
    "packages/korabo-group-worker",
    "packages/group-core",
]
resolver = "2"

[workspace.dependencies]
aws-config = "1.8.18"
aws-sdk-dynamodb = "1.116.0"
aws-sdk-sqs = "1.102.0"
aws-sdk-ssm = "1.113.0"
aws_lambda_events = { version = "1.2.0", default-features = false, features = ["sqs"] }
axum = "0.8.9"
chrono = "0.4.45"
base64 = "0.22.1"
group-core = { path = "./packages/group-core" }
http = "1.4.1"
jwt = { git = "https://github.com/AhmadAiman2013/korabo-common.git", tag = "0.9.0" }
ws-core = { git = "https://github.com/AhmadAiman2013/korabo-ws.git", tag = "0.3.0" }
lambda_runtime = "1.2.1"
lambda_http = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }
tokio = { version = "1.52.3", features = ["macros"] }
thiserror = "2.0.18"
tower-http = { version = "0.7.0", features = ["cors"] }
uuid = { version = "1.23.3", features = ["v4"] }